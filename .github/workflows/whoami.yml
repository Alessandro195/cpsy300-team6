name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrrcosy300team6
  RESOURCE_GROUP: rg-cpsy300-project-team6
  CONTAINERAPP: ca-recipes-team6

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push
        run: |
          IMAGE="$ACR_NAME.azurecr.io/recipes:${{ github.sha }}"
          docker build --platform linux/amd64 -t "$IMAGE" ./cpsy300/cpsy300-team6
          docker push "$IMAGE"

      - name: Deploy
        run: |
          az containerapp update \
            --name "$CONTAINERAPP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/recipes:${{ github.sha }}"
